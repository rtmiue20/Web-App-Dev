<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Outdoor Forum – Prototype</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #4a4f44;
      --bg2: #7c816f;
      --cream: #f1f1ec;
      --ink: #1f231c;
      --btn: #2e3329;
      --mute: #7a7d72;
      --nav: #2a2f26;
      --logo: #f2efd9;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      font-family: Lexend, system-ui, sans-serif;
      color: var(--ink);
      background: radial-gradient(ellipse at 50% 105%, var(--bg2), var(--bg1) 60%);
      overflow-x: hidden
    }

    nav {
      position: fixed;
      top: calc(22px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      align-items: center;
      background: var(--nav);
      padding: 6px;
      border-radius: 999px;
      box-shadow: 0 8px 24px #0005;
      z-index: 5;
      max-width: 96vw;
      overflow-x: auto
    }

    nav a {
      color: #d8dacd;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 11px 18px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: .25s
    }

    nav a:hover {
      color: #fff
    }

    nav a.on {
      background: var(--cream);
      color: var(--ink)
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--cream);
      display: grid;
      place-items: center;
      flex: none
    }

    .logo img {
      width: 26px;
      filter: brightness(0);
      opacity: .85
    }

    .view {
      min-height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 100px 16px 40px
    }

    .view.show {
      display: flex;
      animation: in .35s ease-out
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(8px)
      }
    }

    .card {
      width: 460px;
      max-width: 100%;
      background: var(--cream);
      border-radius: 40px;
      padding: 40px;
      box-shadow: 0 30px 60px #0004;
      transition: transform .3s ease-out, opacity .3s
    }

    .card.out {
      opacity: 0;
      transform: scale(.96);
      pointer-events: none
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--mute);
      font-weight: 600;
      margin: 0
    }

    h1 {
      font-size: 34px;
      font-weight: 500;
      margin: 8px 0 6px
    }

    .sub {
      color: var(--mute);
      font-size: 14px;
      margin: 0 0 26px
    }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--mute);
      font-weight: 600;
      margin: 0 0 8px;
      transition: color .2s
    }

    .f {
      margin-bottom: 18px
    }

    .f:focus-within label {
      color: var(--ink)
    }

    .in {
      position: relative
    }

    input {
      width: 100%;
      height: 48px;
      border-radius: 999px;
      border: 1px solid #dcdcd4;
      background: #fff;
      padding: 0 48px 0 18px;
      font: inherit;
      font-size: 15px;
      color: var(--ink);
      outline: none;
      transition: .25s
    }

    input:focus {
      border-color: var(--btn);
      box-shadow: 0 0 0 3px #2e332922
    }

    input:disabled {
      opacity: .5
    }

    .eye {
      position: absolute;
      right: 8px;
      top: 6px;
      width: 36px;
      height: 36px;
      border: 0;
      background: none;
      cursor: pointer;
      color: var(--mute);
      font-size: 18px
    }

    .go {
      display: block;
      margin: 26px auto 0;
      height: 52px;
      width: 100%;
      border: 0;
      border-radius: 999px;
      background: var(--btn);
      color: var(--cream);
      font: inherit;
      font-weight: 500;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 10px 18px #2e33293a;
      transition: transform .2s, box-shadow .2s
    }

    .go:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 24px #2e332950
    }

    .foot {
      border-top: 1px solid #e0e0d8;
      margin-top: 26px;
      padding-top: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--mute)
    }

    .foot a {
      color: var(--ink);
      text-decoration: underline;
      cursor: pointer;
      font-weight: 500
    }

    /* ===== INTRO: hiệu ứng logo reveal chạy trong lúc xử lý đăng nhập ===== */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 105%, #0f5a4d, #0b4a40 55%, #04251f);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s
    }

    .intro.show {
      opacity: 1;
      pointer-events: auto
    }

    .lock {
      display: flex;
      align-items: center
    }

    .m {
      position: relative;
      width: 100px;
      height: 106px;
      display: grid;
      place-items: center
    }

    .m img {
      height: 106px;
      display: block
    }

    .disc {
      position: absolute;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--logo);
      opacity: 0
    }

    .ring {
      position: absolute;
      inset: -22px;
      width: calc(100% + 44px);
      height: calc(100% + 44px);
      overflow: visible
    }

    .ring circle {
      fill: none;
      stroke: var(--logo);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 22 78;
      stroke-dashoffset: 22;
      opacity: 0
    }

    .w {
      overflow: hidden;
      max-width: 0;
      margin-left: 0
    }

    .w img {
      height: 34px;
      display: block;
      max-width: none
    }

    .tag {
      margin-top: 18px;
      color: var(--logo);
      font-size: 12px;
      letter-spacing: .3em;
      text-transform: uppercase;
      opacity: 0
    }

    .status {
      position: absolute;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      color: #f2efd9aa;
      font-size: 12px;
      letter-spacing: .08em
    }

    .play .disc {
      animation: disc var(--d) linear both
    }

    .play .mk {
      animation: mk var(--d) linear both
    }

    .play .m {
      animation: shr var(--d) linear both
    }

    .play .ring circle {
      animation: ring var(--d) linear both
    }

    .play .w {
      animation: wd var(--d) linear both
    }

    .play .tag {
      animation: tg var(--d) linear both
    }

    .mk {
      opacity: 0
    }

    @keyframes disc {
      0% {
        transform: scale(0);
        opacity: 1;
        animation-timing-function: cubic-bezier(.2, .9, .3, 1.2)
      }

      10% {
        transform: scale(1);
        opacity: 1
      }

      18% {
        transform: scale(1);
        opacity: 1;
        animation-timing-function: ease-in
      }

      30%,
      100% {
        transform: scale(.3);
        opacity: 0
      }
    }

    @keyframes mk {

      0%,
      14% {
        opacity: 0;
        transform: scale(.3) rotate(-140deg);
        clip-path: circle(0%);
        animation-timing-function: cubic-bezier(.2, .8, .2, 1)
      }

      36%,
      100% {
        opacity: 1;
        transform: none;
        clip-path: circle(75%)
      }
    }

    @keyframes ring {

      0%,
      28% {
        opacity: 1;
        stroke-dashoffset: 22;
        animation-timing-function: ease-in-out
      }

      52% {
        opacity: 1;
        stroke-dashoffset: -78
      }

      56%,
      100% {
        opacity: 0;
        stroke-dashoffset: -78
      }
    }

    @keyframes shr {

      0%,
      52% {
        transform: scale(1.5);
        animation-timing-function: ease-in-out
      }

      68%,
      100% {
        transform: scale(1)
      }
    }

    @keyframes wd {

      0%,
      64% {
        max-width: 0;
        margin-left: 0;
        animation-timing-function: ease-out
      }

      88%,
      100% {
        max-width: 240px;
        margin-left: 18px
      }
    }

    @keyframes tg {

      0%,
      84% {
        opacity: 0;
        transform: translateY(8px);
        animation-timing-function: ease-out
      }

      95%,
      100% {
        opacity: 1;
        transform: none
      }
    }

    /* home */
    #home {
      align-items: flex-start
    }

    .wrap {
      width: 1040px;
      max-width: 100%
    }

    .hi {
      color: var(--cream);
      font-size: 30px;
      font-weight: 500;
      margin: 0 0 18px
    }

    .search {
      width: 100%;
      background: var(--cream);
      margin-bottom: 14px
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 22px
    }

    .chip {
      border: 0;
      font: inherit;
      font-size: 13px;
      padding: 9px 18px;
      border-radius: 999px;
      background: #ffffff1c;
      color: var(--cream);
      cursor: pointer;
      transition: .25s
    }

    .chip.on {
      background: var(--cream);
      color: var(--ink)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px
    }

    .post {
      background: var(--cream);
      border-radius: 28px;
      overflow: hidden;
      transition: transform .25s, box-shadow .25s
    }

    .post:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 30px #0004
    }

    .img {
      height: 130px
    }

    .pb {
      padding: 16px 18px 18px
    }

    .pb h3 {
      font-size: 16px;
      font-weight: 500;
      margin: 0 0 6px
    }

    .meta {
      font-size: 12px;
      color: var(--mute);
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .like {
      border: 0;
      background: none;
      font: inherit;
      font-size: 13px;
      color: var(--mute);
      cursor: pointer
    }

    .like span {
      display: inline-block
    }

    .like.on {
      color: #b8893f
    }

    .like.on span {
      animation: pop .35s ease-out
    }

    @keyframes pop {
      50% {
        transform: scale(1.5)
      }
    }

    .av {
      display: none
    }

    .logged .av {
      display: inline-block
    }

    .logged .auth {
      display: none
    }
  </style>
</head>

    // ===== Cấu hình: thời gian xử lý đăng nhập =====
    const MEASURED_MS = 3600;  // thời gian xử lý thực tế (đo từ video mẫu ≈ 3,6s hiệu ứng)
    const EXTRA_MS = 300;      // cộng thêm vài trăm ms cho mượt
    const HOLD_MS = 400;       // giữ logo hoàn chỉnh trước khi vào Trang chủ
    const $ = s => document.querySelector(s), wait = ms => new Promise(r => setTimeout(r, ms));
    const posts = [["Fansipan 2 ngày 1 đêm: lịch trình và chi phí", "Trekking", "#5d7a5a,#2f4a3a"], ["Chọn lều 2 người dưới 3 triệu", "Review đồ", "#8a7f5c,#4d4a35"], ["Cắm trại hồ Dầu Tiếng cuối tuần", "Camping", "#4f7a78,#24403f"], ["Đạp xe Sài Gòn – Đà Lạt 7 ngày", "Cycling", "#7b7f68,#3f4434"], ["Tà Xùa mùa săn mây: cần mang gì?", "Trekking", "#6a6f85,#33384a"], ["Review túi ngủ giữ ấm dưới 10°C", "Review đồ", "#7d6a5a,#40342b"]];
    let cat = "Tất cả";
    function render() { $("#grid").innerHTML = posts.filter(p => cat === "Tất cả" || p[1] === cat).map((p, i) => `<article class="post"><div class="img" style="background:linear-gradient(135deg,${p[2]})"></div><div class="pb"><h3>${p[0]}</h3><div class="meta"><span>${p[1]} · rt.miue20</span><button class="like"><span>♥</span> ${12 + i * 7}</button></div></div></article>`).join("") }
    render();
    $("#chips").onclick = e => { if (!e.target.classList.contains("chip")) return; document.querySelectorAll(".chip").forEach(c => c.classList.remove("on")); e.target.classList.add("on"); cat = e.target.textContent; render() };
    $("#grid").onclick = e => { const b = e.target.closest(".like"); if (b) { b.classList.remove("on"); void b.offsetWidth; b.classList.add("on") } };
    $("#eye").onclick = () => { const p = $("#p"); p.type = p.type === "password" ? "text" : "password" };
    function show(id) { document.querySelectorAll(".view").forEach(v => v.classList.toggle("show", v.id === id)); document.querySelectorAll("nav a[data-go]").forEach(a => a.classList.toggle("on", a.dataset.go === id)) }
    document.querySelectorAll("nav a[data-go]").forEach(a => a.onclick = () => show(a.dataset.go));
    let busy = false;
    $("#go").onclick = async () => {
      if (busy) return; busy = true;
      const total = MEASURED_MS + EXTRA_MS, intro = $("#intro"), t0 = performance.now();
      $("#u").disabled = $("#p").disabled = true; $("#card").classList.add("out");
      await wait(250);
      intro.style.setProperty("--d", total + "ms");
      intro.classList.remove("play"); void intro.offsetWidth; intro.classList.add("show", "play");
      const tick = setInterval(() => { $("#status").textContent = `Đang xử lý đăng nhập… ${Math.min(total, Math.round(performance.now() - t0 - 250))} / ${total}ms (${MEASURED_MS} + ${EXTRA_MS})` }, 50);
      await wait(total + HOLD_MS);
      clearInterval(tick);
      $("#nav").classList.add("logged"); show("home");
      intro.classList.remove("show"); await wait(300); intro.classList.remove("play");
      $("#card").classList.remove("out"); $("#u").disabled = $("#p").disabled = false; busy = false;
    };
  </script>
</body>

</html>
